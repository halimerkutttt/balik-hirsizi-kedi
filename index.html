<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Balık Hırsızı Kedi | Mobil İngilizce Kelime Uygulaması</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Üst Yardımcı Araçlar (Geliştirici & Önizleme Barı) -->
  <div class="dev-toolbar">
    <div class="dev-title">
      <span class="app-logo">🐟🐾</span>
      <strong>Balık Hırsızı Kedi</strong>
      <span class="badge-v">Mobil Prototip v1.0</span>
    </div>
    <div class="dev-controls">
      <button class="tool-btn" id="toggle-frame-btn" title="Telefon Çerçevesi / Tam Ekran Değiştir">
        📱 Çerçeveyi Değiştir
      </button>
      <button class="tool-btn" id="btn-mute-toggle" title="Ses Aç/Kapat">
        🔊
      </button>
    </div>
  </div>

  <!-- Mobil Cihaz Çerçevesi Sarmalayıcısı -->
  <div class="device-viewport-wrapper">
    <div class="mobile-phone-frame">
      <!-- Telefon Hoparlör & Kamera Çentiği -->
      <div class="phone-dynamic-island">
        <div class="island-camera"></div>
        <div class="island-speaker"></div>
      </div>

      <!-- Mobil Ekran İçeriği -->
      <div class="mobile-screen-content">
        <!-- Telefon Sistem Durum Çubuğu -->
        <div class="phone-status-bar">
          <span class="phone-time">09:41</span>
          <div class="phone-status-icons">
            <span>📶</span>
            <span>📡</span>
            <span>🔋</span>
          </div>
        </div>

        <!-- Uygulama Üst Bilgi Barı (Stats Header) -->
        <header class="app-top-header">
          <div class="stat-pill-group">
            <!-- Tombulluk / Kilo Sayacı -->
            <div class="header-stat-chip weight-chip" title="Kedi Ağırlığı (Balık yedikçe artar, sporla azalır)">
              <span class="chip-icon">⚖️</span>
              <span class="chip-val" id="stat-weight">4.2 kg</span>
            </div>

            <!-- Balık Parası -->
            <div class="header-stat-chip fish-chip" title="Aşırılan Taze Balıklar (Gardıropta harcanır)">
              <span class="chip-icon">🐟</span>
              <span class="chip-val" id="stat-fish">3</span>
            </div>

            <!-- Günlük Seri -->
            <div class="header-stat-chip streak-chip" title="Günlük Öğrenme Serisi">
              <span class="chip-icon">🔥</span>
              <span class="chip-val" id="stat-streak">4</span>
            </div>
          </div>
        </header>

        <!-- Ana Dinamik İçerik Alanı (Sekmeler) -->
        <main class="app-main-viewport">
          <section id="tab-home" class="tab-page active"></section>
          <section id="tab-cards" class="tab-page"></section>
          <section id="tab-heist" class="tab-page"></section>
          <section id="tab-gym" class="tab-page"></section>
          <section id="tab-wardrobe" class="tab-page"></section>
          <section id="tab-friends" class="tab-page"></section>
          <section id="tab-library" class="tab-page"></section>
        </main>

        <!-- Mobil Alt Gezinme Barı (Bottom Navigation) -->
        <nav class="app-bottom-navbar">
          <button class="nav-item active" data-tab="home">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Kamp</span>
          </button>
          <button class="nav-item" data-tab="cards">
            <span class="nav-icon">🃏</span>
            <span class="nav-text">Kartlar</span>
          </button>
          <button class="nav-item heist-nav-highlight" data-tab="heist">
            <span class="nav-icon">🎣</span>
            <span class="nav-text">Balık Avı</span>
          </button>
          <button class="nav-item" data-tab="gym">
            <span class="nav-icon">🏋️</span>
            <span class="nav-text">Spor</span>
          </button>
          <button class="nav-item" data-tab="wardrobe">
            <span class="nav-icon">🐱</span>
            <span class="nav-text">Gardırop</span>
          </button>
          <button class="nav-item" data-tab="friends">
            <span class="nav-icon">👥</span>
            <span class="nav-text">Çete</span>
          </button>
        </nav>

        <!-- Telefon Alt Çizgisi (Home Indicator) -->
        <div class="phone-home-indicator"></div>
      </div>
    </div>
  </div>

  <!-- Script Bağımlılıkları -->
  <script src="js/words-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game-heist.js"></script>
  <script src="js/game-gym.js"></script>
  <script src="js/wardrobe.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
